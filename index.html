<style>
/* Layout: one centered study column — deck switcher, progress strip, one flip card, answer controls */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#18231e; --muted:#5b6b63; --line:#cdd8d2;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --ok:#2f7d3a; --ok-soft:#e1f0e2; --todo:#b25a12; --todo-soft:#f8e8d8;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#18221d; --ink:#e6eee9; --muted:#9db0a6; --line:#2d3b34;
  --accent:#4fbf95; --accent-ink:#0c1511; --accent-soft:#1f3a2f;
  --ok:#6cc47a; --ok-soft:#1d3322; --todo:#f0a259; --todo-soft:#3b2a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221d; --ink:#e6eee9; --muted:#9db0a6; --line:#2d3b34;
  --accent:#4fbf95; --accent-ink:#0c1511; --accent-soft:#1f3a2f;
  --ok:#6cc47a; --ok-soft:#1d3322; --todo:#f0a259; --todo-soft:#3b2a19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.decks{display:flex;flex-wrap:wrap;gap:8px}
.decks button,.tool{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.decks button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.decks .n{font-family:var(--f-mono);font-size:.75rem;opacity:.8;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.stats{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.stats .s-ok{color:var(--ok)} .stats .s-todo{color:var(--todo)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{padding:6px 12px;font-size:.82rem}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress .p-ok{background:var(--ok)} .progress .p-todo{background:var(--todo)}
.scene{perspective:1600px}
.card{display:grid;cursor:pointer;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;position:relative}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;min-height:300px;display:flex;flex-direction:column;gap:12px;min-width:0}
.back{transform:rotateY(180deg)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip{border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.status-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.status-todo{color:var(--todo);border-color:var(--todo);background:var(--todo-soft)}
.front h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.2;margin:auto 0;text-wrap:balance}
.front .hint{color:var(--muted);font-size:.9rem;margin-top:auto}
.back h3{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0;color:var(--accent)}
.back ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.back li{padding-left:2px}
.back li::marker{color:var(--accent)}
.back .note{margin-top:auto;font-size:.85rem;color:var(--todo);border-top:1px dashed var(--line);padding-top:8px}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.nav{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer}
.answer{display:flex;gap:10px}
.answer button{flex:1;font:700 1rem var(--f-display);border-radius:10px;padding:12px;cursor:pointer;border:1px solid}
.b-todo{background:var(--todo-soft);color:var(--todo);border-color:var(--todo)}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.b-flip{flex:1;font:700 1rem var(--f-display);border-radius:10px;padding:12px;cursor:pointer;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.keys{font-size:.8rem;color:var(--muted);text-align:center}
.keys kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
@media (max-width:480px){.controls{grid-template-columns:1fr 1fr}.controls .mid{grid-column:1/-1;grid-row:1}.face{padding:18px 16px}.keys{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%}
[hidden]{display:none!important}
button,.card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.swipe-hint{display:none;font-size:.8rem;color:var(--muted);text-align:center;margin:0}
@media (hover:none){.swipe-hint{display:block}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Flashcards de la soutenance</h1>
    <p>Retourne chaque carte, énumère les points à voix haute, puis classe-la. Dylan HACQUARD · Bachelor AIS</p>
  </header>

  <nav class="decks" id="decks" aria-label="Paquets"></nav>

  <div class="bar">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="tool" id="t-todo" aria-pressed="false">Seulement « à revoir »</button>
      <button class="tool" id="t-shuffle" aria-pressed="false">Mélanger</button>
      <button class="tool" id="t-reset">Remettre à zéro</button>
    </div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"><i class="p-ok"></i><i class="p-todo"></i></div>

  <div id="stage"></div>

  <p class="swipe-hint">Glisse la carte vers la gauche ou la droite pour changer de carte.</p>
  <p class="keys"><kbd>Espace</kbd> retourner · <kbd>←</kbd> <kbd>→</kbd> naviguer · <kbd>1</kbd> à revoir · <kbd>2</kbd> je sais</p>
</div>

 ["Personnel","Pourquoi la restauration n'est pas automatique ?",["Une erreur de chemin peut écraser des données saines","Confirmation du chemin, « / » interdit"]],
 ["Toi","Si c'était à refaire ?",["Prépare ta réponse personnelle"],"À écrire toi-même avant le jour J."],

].map(([p,q,pts,note])=>({deck:"questions",part:p,title:q,points:pts,note}))
];
CARDS.forEach((c,i)=>c.id=c.deck+"-"+i);

const DECKS=[["oral","Déroulé de l'oral"],["chiffres","Chiffres clés"],["questions","Questions du jury"],["all","Tout"]];
const KEY="flash-ais-v1";
let state={deck:"oral",onlyTodo:false,shuffle:false,status:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.status) state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

let order=[],pos=0,flipped=false;
function build(){
  let list=CARDS.filter(c=>state.deck==="all"||c.deck===state.deck);
  if(state.onlyTodo) list=list.filter(c=>state.status[c.id]==="todo");
  order=list.map(c=>c.id);
  if(state.shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;flipped=false;render();
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function renderDecks(){
  document.getElementById("decks").innerHTML=DECKS.map(([k,l])=>{
    const n=CARDS.filter(c=>k==="all"||c.deck===k).length;
    return `<button data-deck="${k}" aria-pressed="${state.deck===k}">${l}<span class="n">${n}</span></button>`}).join("");
}
function render(){
  renderDecks();
  document.getElementById("t-todo").setAttribute("aria-pressed",state.onlyTodo);
  document.getElementById("t-shuffle").setAttribute("aria-pressed",state.shuffle);
  const pool=CARDS.filter(c=>state.deck==="all"||c.deck===state.deck);
  const ok=pool.filter(c=>state.status[c.id]==="ok").length, todo=pool.filter(c=>state.status[c.id]==="todo").length;
  document.getElementById("stats").innerHTML=`<span>Carte <b>${order.length?pos+1:0}</b>/${order.length}</span><span class="s-ok">${ok} sues</span><span class="s-todo">${todo} à revoir</span><span>${pool.length-ok-todo} jamais vues</span>`;
  const [pOk,pTodo]=document.querySelectorAll("#progress i");
  pOk.style.width=(pool.length?ok/pool.length*100:0)+"%"; pTodo.style.width=(pool.length?todo/pool.length*100:0)+"%";
  const stage=document.getElementById("stage");
  if(!order.length){
    stage.innerHTML=`<div class="empty">${state.onlyTodo?"Aucune carte « à revoir » dans ce paquet. Désactive le filtre pour tout reprendre.":"Ce paquet est vide."}</div>`;return;
  }
  const c=CARDS.find(x=>x.id===order[pos]);
  const st=state.status[c.id];
  const stChip=st?`<span class="chip ${st==="ok"?"status-ok":"status-todo"}">${st==="ok"?"Sue":"À revoir"}</span>`:"";
  const time=c.time?`<span class="chip">${c.time}</span>`:"";
  const prompt=c.deck==="oral"?"Énumère les points à dire, puis retourne la carte.":c.deck==="chiffres"?"Donne le chiffre, puis retourne la carte.":"Réponds à voix haute, puis retourne la carte.";
  stage.innerHTML=`<div class="scene"><div class="card ${flipped?"flipped":""}" id="card" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="face front" aria-hidden="${flipped}">
      <div class="meta"><span>${esc(c.part)}</span><span style="display:flex;gap:6px">${time}${stChip}</span></div>
      <h2>${esc(c.title)}</h2>
      <p class="hint">${prompt}</p>
    </div>
    <div class="face back" aria-hidden="${!flipped}">
      <div class="meta"><span>${esc(c.part)}</span>${time}</div>
      <h3>${esc(c.title)}</h3>
      <ul>${c.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
      ${c.note?`<p class="note">${esc(c.note)}</p>`:""}
    </div></div></div>
  <div class="controls" style="margin-top:14px">
    <button class="nav" id="prev" ${pos===0?"disabled":""}>← Précédente</button>
    <div class="mid">${flipped?`<div class="answer"><button class="b-todo" id="b-todo">À revoir</button><button class="b-ok" id="b-ok">Je sais</button></div>`:`<div class="answer"><button class="b-flip" id="b-flip">Retourner</button></div>`}</div>
    <button class="nav" id="next" ${pos===order.length-1?"disabled":""}>Suivante →</button>
  </div>`;
  document.getElementById("card").onclick=flip;
  document.getElementById("prev").onclick=()=>go(-1);
  document.getElementById("next").onclick=()=>go(1);
  const f=document.getElementById("b-flip"); if(f) f.onclick=flip;
  const bt=document.getElementById("b-todo"); if(bt) bt.onclick=()=>mark("todo");
  const bo=document.getElementById("b-ok"); if(bo) bo.onclick=()=>mark("ok");
}
function flip(){flipped=!flipped;const el=document.getElementById("card"); el.classList.toggle("flipped",flipped); setTimeout(render, matchMedia("(prefers-reduced-motion: reduce)").matches?0:450);}
function go(d){const n=pos+d; if(n<0||n>=order.length) return; pos=n; flipped=false; render();}
function mark(s){
  const id=order[pos]; state.status[id]=s; save();
  if(state.onlyTodo&&s==="ok"){order.splice(pos,1); if(pos>=order.length) pos=Math.max(0,order.length-1); flipped=false; render(); return;}
  if(pos<order.length-1){pos++;flipped=false;} render();
}
document.getElementById("decks").addEventListener("click",e=>{const b=e.target.closest("button[data-deck]"); if(!b) return; state.deck=b.dataset.deck; save(); build();});
document.getElementById("t-todo").onclick=()=>{state.onlyTodo=!state.onlyTodo; save(); build();};
document.getElementById("t-shuffle").onclick=()=>{state.shuffle=!state.shuffle; save(); build();};
const reset=document.getElementById("t-reset"); let armed=false;
reset.onclick=()=>{ if(!armed){armed=true; reset.textContent="Confirmer la remise à zéro"; setTimeout(()=>{armed=false; reset.textContent="Remettre à zéro";},3000); return;}
  armed=false; reset.textContent="Remettre à zéro"; state.status={}; save(); build();};
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea")) return;
  if((e.key===" "||e.key==="Enter")&&e.target.closest&&e.target.closest("button")) return;
  if(e.key===" "||(e.key==="Enter"&&e.target.id==="card")){e.preventDefault(); flip();}
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="1"&&flipped) mark("todo");
  else if(e.key==="2"&&flipped) mark("ok");
});
build();

(function(){let x0=null,y0=null;const st=document.getElementById("stage");
st.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
st.addEventListener("touchend",e=>{if(x0===null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1);}},{passive:true});})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>

</body>
</html>
