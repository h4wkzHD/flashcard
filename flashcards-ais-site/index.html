<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one centered study column — deck switcher, progress strip, one flip card, answer controls */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#18231e; --muted:#5b6b63; --line:#cdd8d2;
  --accent:#1d6b52; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --ok:#2f7d3a; --ok-soft:#e1f0e2; --warn:#8a6a00; --warn-soft:#f6edc8; --todo:#b25a12; --todo-soft:#f8e8d8;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#18221d; --ink:#e6eee9; --muted:#9db0a6; --line:#2d3b34;
  --accent:#4fbf95; --accent-ink:#0c1511; --accent-soft:#1f3a2f;
  --ok:#6cc47a; --ok-soft:#1d3322; --warn:#e3c35a; --warn-soft:#352e14; --todo:#f0a259; --todo-soft:#3b2a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221d; --ink:#e6eee9; --muted:#9db0a6; --line:#2d3b34;
  --accent:#4fbf95; --accent-ink:#0c1511; --accent-soft:#1f3a2f;
  --ok:#6cc47a; --ok-soft:#1d3322; --warn:#e3c35a; --warn-soft:#352e14; --todo:#f0a259; --todo-soft:#3b2a19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.decks{display:flex;flex-wrap:wrap;gap:8px}
.decks button,.tool{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.decks button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.decks .n{font-family:var(--f-mono);font-size:.75rem;opacity:.8;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.stats{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:500}
.stats .s-ok{color:var(--ok)} .stats .s-todo{color:var(--todo)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{padding:6px 12px;font-size:.82rem}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.progress .p-ok{background:var(--ok)} .progress .p-todo{background:var(--todo)}
.scene{perspective:1600px}
.card{display:grid;cursor:pointer;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;position:relative}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;min-height:300px;display:flex;flex-direction:column;gap:12px;min-width:0}
.back{transform:rotateY(180deg)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip{border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.status-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.status-todo{color:var(--todo);border-color:var(--todo);background:var(--todo-soft)}
.front h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.2;margin:auto 0;text-wrap:balance}
.front .hint{color:var(--muted);font-size:.9rem;margin-top:auto}
.back h3{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:0;color:var(--accent)}
.back ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.back li{padding-left:2px}
.back li::marker{color:var(--accent)}
.back .note{margin-top:auto;font-size:.85rem;color:var(--todo);border-top:1px dashed var(--line);padding-top:8px}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.nav{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer}
.answer{display:flex;gap:10px}
.answer button{flex:1;font:700 1rem var(--f-display);border-radius:10px;padding:12px;cursor:pointer;border:1px solid}
.b-todo{background:var(--todo-soft);color:var(--todo);border-color:var(--todo)}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.b-flip{flex:1;font:700 1rem var(--f-display);border-radius:10px;padding:12px;cursor:pointer;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.keys{font-size:.8rem;color:var(--muted);text-align:center}
.keys kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
@media (max-width:480px){.controls{grid-template-columns:1fr 1fr}.controls .mid{grid-column:1/-1;grid-row:1}.face{padding:18px 16px}.keys{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%}
[hidden]{display:none!important}
button,.card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.swipe-hint{display:none;font-size:.8rem;color:var(--muted);text-align:center;margin:0}
@media (hover:none){.swipe-hint{display:block}}

.answer-box{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.answer-box label{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.answer-box textarea{width:100%;font:1rem/1.45 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;min-height:110px}
.answer-box textarea:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.answer-box .answer .nav{flex:0 0 auto}
.verdict{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;border:1px solid;font-variant-numeric:tabular-nums}
.verdict b{font-family:var(--f-display);font-size:1.15rem}
.v-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.v-partial{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.v-ko{background:var(--todo-soft);color:var(--todo);border-color:var(--todo)}
.back ul.graded{list-style:none;padding-left:0}
.back ul.graded li{display:grid;grid-template-columns:1.4em 1fr;gap:4px;align-items:start}
.back ul.graded li.hit .mk{color:var(--ok);font-weight:700}
.back ul.graded li.miss .mk{color:var(--todo);font-weight:700}
.back ul.graded li.miss{color:var(--ink)}
.back ul.graded li.hit{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.yours{border-top:1px dashed var(--line);padding-top:8px;font-size:.9rem;color:var(--muted)}
.yours span{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.yours p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.b-todo.sel,.b-ok.sel{box-shadow:0 0 0 3px var(--accent-soft) inset;outline:2px solid currentColor;outline-offset:1px}
.auto{font-size:.85rem;color:var(--muted);text-align:center;margin:6px 0 0}
.face{min-height:220px}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Flashcards de la soutenance</h1>
    <p>Écris ta réponse, vérifie-la : chaque point attendu trouvé ou manquant s'affiche. Dylan HACQUARD · Bachelor AIS</p>
  </header>

  <nav class="decks" id="decks" aria-label="Paquets"></nav>

  <div class="bar">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="tool" id="t-todo" aria-pressed="false">Seulement « à revoir »</button>
      <button class="tool" id="t-shuffle" aria-pressed="false">Mélanger</button>
      <button class="tool" id="t-reset">Remettre à zéro</button>
    </div>
  </div>
  <div class="progress" id="progress" aria-hidden="true"><i class="p-ok"></i><i class="p-todo"></i></div>

  <div id="stage"></div>

  <p class="swipe-hint">Glisse la carte vers la gauche ou la droite pour changer de carte.</p>
  <p class="keys"><kbd>Ctrl</kbd>+<kbd>Entrée</kbd> vérifier · <kbd>Espace</kbd> retourner · <kbd>←</kbd> <kbd>→</kbd> naviguer · <kbd>1</kbd> à revoir · <kbd>2</kbd> je sais</p>
</div>

<script>
const D = (part, title, time, points, note) => ({deck:"oral", part, title, time, points, note});
const CARDS = [
// ---------- DÉROULÉ ----------
D("Introduction","Slide de titre : ton ouverture","30 s",[
 "Bonjour + merci de m'accueillir",
 "Nom, Bachelor AIS à l'IPSSI Nice",
 "Alternant au service IPS du CA Provence Côte d'Azur, tuteur Jérémy Hamed",
 "Annonce : 3 projets, et surtout comment je les ai conduits"]),
D("Introduction","Slide 1 : ton parcours","30 s",[
 "BTS SIO SISR, Campus du Beaujolais (Villefranche-sur-Saône)",
 "Bachelor AIS en alternance pour aller plus loin en sécurité",
 "CA PCA, site de Draguignan, depuis octobre 2025",
 "La banque : sécurité et disponibilité non négociables"]),

 "Personnel : seul, sans échéance, dépôt Git public",
 "Choisis avec le tuteur pour couvrir les 10 compétences ensemble"]),
D("Contexte","Slide 4 : le Crédit Agricole PCA","1 min",[
 "1 des 39 Caisses régionales, 1er groupe bancaire français, coopératif",
 "1 M de clients, 2 820 collaborateurs, 205 agences, ~60 alternants",
 "04, 06, 83 + Monaco ; sites : Manosque, Saint-Laurent-du-Var (DG), Draguignan (siège)",
 "500 000 sociétaires, 600 administrateurs, 51 Caisses locales",
 "À retenir : le projet se joue entre Draguignan et Saint-Laurent-du-Var"]),
D("Contexte","Slide 5 : qui fait quoi dans l'informatique","1 min",[
 "CA-TS : le logiciel bancaire des 39 Caisses (1 700 collab., 6 sites)",
 "CA-GIP (2019) : production, datacenters, ~80 % de la prod (2 000 collab.)",
 "IPS : proximité, support, parc, MCO, projets locaux",
 "IPS n'intervient pas sur le réseau bancaire"]),
D("Contexte","Slide 6 : l'unité IPS3 et ton rôle","1 min",[
 "~10 personnes, responsable Bernard Avella, tuteur Jérémy Hamed",
 "Tickets METIS : qualifier, diagnostiquer, résoudre ou réaffecter, documenter",

 "Saint-Laurent-du-Var : ESXi, mais Centreon hors service",
 "Draguignan : serveurs physiques, rien de supervisé",

 "Manque 4 : documentation dispersée"]),
D("Projet d'entreprise","Slide 10 : le pilotage","1 min 30",[
 "Antoine et Quentin à Saint-Laurent-du-Var, moi à Draguignan",

 "Installé en octobre 2025, hôte ESX-DRG, 222,9 jours sans interruption",

D("Projet d'entreprise","Slide 13 : l'Active Directory","1 min 30",[

D("Projet d'entreprise","Slide 17 : l'incident réel","1 min",[

 "AD réparti : principal à Saint-Laurent-du-Var, réplica à Draguignan",
 "Leçon : vrais utilisateurs, donc tests, fenêtres de maintenance, validation avant bascule"]),

 "Client fictif OnStream : 149 à Paris + 19 à Marseille = 168 salariés",

D("Hackathon","Slide 22 : la gestion de projet","1 min 30",[
 "Lundi lancement, maquette l'après-midi, 3 jours de réalisation",
 "Livrables dimanche soir, soutenance lundi suivant",
 "4 lots : socle réseau, proxy, IDS/IPS (moi), extranet",
 "Kanban GitHub : écarts visibles dès le 2e jour, renfort des lots en retard",
 "Cours le matin, réalisation l'après-midi"]),
D("Hackathon","Slide 23 : l'architecture","1 min",[
 "Gauche : architecture imposée ; droite : ce qu'on a déployé",
 "Cluster à Paris, tunnel IPsec, DMZ à Marseille",

 "Lots des coéquipiers : rester rapide",
 "CARP : IP virtuelle partagée ; pfsync : tables d'état synchronisées",

D("Bilan","Slide 32 : les 10 compétences","1 min",[
 "Entreprise : CP1 à CP7",
 "Hackathon : CP2, CP5 + le bloc cyber CP8, CP9, CP10",
 "Personnel : CP1 et CP3",

D("Bilan","Slide 33 : le bilan et la fin","1 min 30",[
 "Entreprise : continuité de service, durée, vraie production",

CARDS.forEach((c,i)=>c.id=c.deck+"-"+i);

const DECKS=[["oral","Déroulé de l'oral"],["chiffres","Chiffres clés"],["questions","Questions du jury"],["all","Tout"]];
const KEY="flash-ais-v1";
let state={deck:"oral",onlyTodo:false,shuffle:false,status:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.status) state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ---------- Correction automatique ----------
   Chaque point de la réponse attendue est réduit à ses mots-clés (chiffres, sigles,
   mots de 4 lettres et plus hors mots courants). Un point est validé quand ta réponse
   contient au moins 40 % de ses mots-clés (2 suffisent ; 60 % pour les chiffres clés). Les mots sont comparés sur
   leurs 5 premières lettres, sans accents, pour tolérer pluriels et conjugaisons. */
const STOP=new Set(("avec dans pour plus sans mais donc sous entre chaque tout tous toute toutes etre avoir fait faire cette ces leur leurs aussi tres seulement apres avant depuis vers comme quand alors encore puis deja meme autre autres elle elles nous vous etait sont peut doit dois ainsi chez selon contre lors part bien trop rien quoi celui celle ceux dont votre notre pendant ensuite pourquoi comment quel quelle quels quelles aucun aucune moins plusieurs juste qui que quoi une des les est ont sur par pas ton ta tes mon ma mes son sa ses the and was donne dire cela ceci voici voila parce manque slide exemple exemples phrase lecon point points garder retenir").split(" "));
const ALIAS={slv:"saint laurent var",drg:"draguignan",ad:"active directory annuaire",dc:"controleur",hs:"hors service",doc:"documentation",docs:"documentation",supervision:"superviser",vm:"machine virtuelle",vms:"machines virtuelles",fw:"pare feu",firewall:"pare feu",ha:"haute disponibilite",mfa:"double authentification","2fa":"double authentification",cle:"cle",ldap:"annuaire",ca:"credit agricole",ips3:"ips",bdd:"base donnees",sauvegarde:"backup",backup:"sauvegarde",proxy:"proxy",rp:"reverse proxy"};
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/(\d)[\s  .](?=\d{3}\b)/g,"$1")   // 2 820 -> 2820, 9.000.000 -> 9000000
    .replace(/(\d),(\d)/g,"$1.$2");                       // 49,24 -> 49.24
}
function toks(s){return norm(s).match(/[a-z0-9]+(?:\.[0-9]+)?/g)||[];}
function ansToks(s){const t=toks(s);const out=[...t];for(const w of t){if(ALIAS[w]) out.push(...toks(ALIAS[w]));}return out;}
function keywords(point){
  const raw=String(point).match(/[\p{L}\p{N}][\p{L}\p{N}.,'\-_/]*/gu)||[];
  const out=[];
  for(const w of raw){
    const isAcr=/^[A-Z0-9][A-Z0-9\-_.]+$/.test(w)&&/[A-Z]/.test(w)&&w.length>=2;
    for(const t of toks(w)){
      const hasDigit=/\d/.test(t);
      if(/^\d$/.test(t)&&!/^\d+$/.test(String(point).trim())) continue;
      if(hasDigit||isAcr||(t.length>=4&&!STOP.has(t))){ if(!out.includes(t)) out.push(t); }
    }
  }
  if(!out.length){ for(const t of toks(point)) if(t.length>=3&&!STOP.has(t)&&!out.includes(t)) out.push(t); }
  return out;
}
function hasKw(kw,ansToks,ansJoined){
  if(/\d/.test(kw)) return ansToks.includes(kw)||ansJoined.includes(kw);
  if(kw.length<=4) return ansToks.includes(kw);
  const stem=kw.slice(0,5);
  return ansToks.some(t=>t.length>=4&&(t.startsWith(stem)||kw.startsWith(t.slice(0,5))&&t.length>=5));
}
function grade(card,answer){
  const at=ansToks(answer), aj=at.join(" ");
  const res=card.points.map(p=>{
    const kws=keywords(p); const found=kws.filter(k=>hasKw(k,at,aj));
    const need=card.deck==="chiffres"?Math.max(1,Math.ceil(kws.length*0.6)):Math.min(2,Math.max(1,Math.ceil(kws.length*0.4)));
    return {point:p,hit:kws.length===0?false:found.length>=need,found:found.length,total:kws.length};
  });
  const hits=res.filter(r=>r.hit).length, ratio=hits/res.length;
  const verdict=ratio>=0.7?"ok":ratio>=0.4?"partial":"ko";
  return {res,hits,total:res.length,verdict};
}

let order=[],pos=0,flipped=false,result=null,draft="";
function build(){
  let list=CARDS.filter(c=>state.deck==="all"||c.deck===state.deck);
  if(state.onlyTodo) list=list.filter(c=>state.status[c.id]==="todo");
  order=list.map(c=>c.id);
  if(state.shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  pos=0;resetCard();render();
}
function resetCard(){flipped=false;result=null;draft="";}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function renderDecks(){
  document.getElementById("decks").innerHTML=DECKS.map(([k,l])=>{
    const n=CARDS.filter(c=>k==="all"||c.deck===k).length;
    return `<button data-deck="${k}" aria-pressed="${state.deck===k}">${l}<span class="n">${n}</span></button>`}).join("");
}
const VERDICT={ok:["v-ok","Juste"],partial:["v-partial","Partiel"],ko:["v-ko","À revoir"]};
function render(){
  renderDecks();
  document.getElementById("t-todo").setAttribute("aria-pressed",state.onlyTodo);
  document.getElementById("t-shuffle").setAttribute("aria-pressed",state.shuffle);
  const pool=CARDS.filter(c=>state.deck==="all"||c.deck===state.deck);
  const ok=pool.filter(c=>state.status[c.id]==="ok").length, todo=pool.filter(c=>state.status[c.id]==="todo").length;
  document.getElementById("stats").innerHTML=`<span>Carte <b>${order.length?pos+1:0}</b>/${order.length}</span><span class="s-ok">${ok} sues</span><span class="s-todo">${todo} à revoir</span><span>${pool.length-ok-todo} jamais vues</span>`;
  const [pOk,pTodo]=document.querySelectorAll("#progress i");
  pOk.style.width=(pool.length?ok/pool.length*100:0)+"%"; pTodo.style.width=(pool.length?todo/pool.length*100:0)+"%";
  const stage=document.getElementById("stage");
  if(!order.length){
    stage.innerHTML=`<div class="empty">${state.onlyTodo?"Aucune carte « à revoir » dans ce paquet. Désactive le filtre pour tout reprendre.":"Ce paquet est vide."}</div>`;return;
  }
  const c=CARDS.find(x=>x.id===order[pos]);
  const st=state.status[c.id];
  const stChip=st?`<span class="chip ${st==="ok"?"status-ok":"status-todo"}">${st==="ok"?"Sue":"À revoir"}</span>`:"";
  const time=c.time?`<span class="chip">${c.time}</span>`:"";
  const prompt=c.deck==="oral"?"Écris les points à dire, puis vérifie.":c.deck==="chiffres"?"Écris le chiffre, puis vérifie.":"Écris ta réponse, puis vérifie.";
  const items=c.points.map((p,i)=>{
    if(!result) return `<li>${esc(p)}</li>`;
    const r=result.res[i];
    return `<li class="${r.hit?"hit":"miss"}"><span class="mk" aria-hidden="true">${r.hit?"✓":"✗"}</span><span class="sr">${r.hit?"Trouvé : ":"Manquant : "}</span>${esc(p)}</li>`;
  }).join("");
  const banner=result?`<div class="verdict ${VERDICT[result.verdict][0]}"><b>${VERDICT[result.verdict][1]}</b><span>${result.hits}/${result.total} point${result.total>1?"s":""} trouvé${result.hits>1?"s":""}</span></div>`:"";
  const yours=result?`<div class="yours"><span>Ta réponse</span><p>${esc(draft)||"<i>vide</i>"}</p></div>`:"";
  stage.innerHTML=`<div class="scene"><div class="card ${flipped?"flipped":""}" id="card" tabindex="0" role="button" aria-label="Retourner la carte">
    <div class="face front" aria-hidden="${flipped}">
      <div class="meta"><span>${esc(c.part)}</span><span style="display:flex;gap:6px">${time}${stChip}</span></div>
      <h2>${esc(c.title)}</h2>
      <p class="hint">${prompt}</p>
    </div>
    <div class="face back" aria-hidden="${!flipped}">
      <div class="meta"><span>${esc(c.part)}</span>${time}</div>
      ${banner}
      <h3>${esc(c.title)}</h3>
      <ul class="${result?"graded":""}">${items}</ul>
      ${c.note?`<p class="note">${esc(c.note)}</p>`:""}
      ${yours}
    </div></div></div>
  ${flipped?"":`<div class="answer-box">
    <label for="answer">Ta réponse</label>
    <textarea id="answer" rows="4" placeholder="Tape ou dicte ta réponse (micro du clavier)…" autocomplete="off" autocapitalize="sentences" spellcheck="true">${esc(draft)}</textarea>
    <div class="answer"><button class="b-flip" id="b-check">Vérifier ma réponse</button><button class="nav" id="b-flip">Voir la réponse</button></div>
  </div>`}
  <div class="controls" style="margin-top:14px">
    <button class="nav" id="prev" ${pos===0?"disabled":""}>← Précédente</button>
    <div class="mid">${flipped?`<div class="answer"><button class="b-todo ${result&&result.verdict!=="ok"?"sel":""}" id="b-todo">À revoir</button><button class="b-ok ${result&&result.verdict==="ok"?"sel":""}" id="b-ok">Je sais</button></div>`:""}</div>
    <button class="nav" id="next" ${pos===order.length-1?"disabled":""}>Suivante →</button>
  </div>
  ${flipped&&result?`<p class="auto">Carte classée automatiquement en « ${result.verdict==="ok"?"Je sais":"À revoir"} ». Tu peux corriger avec les boutons.</p>`:""}`;
  document.getElementById("card").onclick=()=>{ if(!flipped&&!result){flip();} else if(flipped){flip();} };
  document.getElementById("prev").onclick=()=>go(-1);
  document.getElementById("next").onclick=()=>go(1);
  const ta=document.getElementById("answer");
  if(ta){ ta.oninput=()=>{draft=ta.value;};
    ta.onkeydown=e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault(); check();} }; }
  const bc=document.getElementById("b-check"); if(bc) bc.onclick=check;
  const f=document.getElementById("b-flip"); if(f) f.onclick=flip;
  const bt=document.getElementById("b-todo"); if(bt) bt.onclick=()=>mark("todo");
  const bo=document.getElementById("b-ok"); if(bo) bo.onclick=()=>mark("ok");
}
function check(){
  const c=CARDS.find(x=>x.id===order[pos]); const ta=document.getElementById("answer");
  draft=ta?ta.value:draft;
  if(!draft.trim()){ if(ta){ta.focus(); ta.placeholder="Écris au moins quelques mots avant de vérifier.";} return; }
  result=grade(c,draft);
  state.status[c.id]=result.verdict==="ok"?"ok":"todo"; save();
  flipped=true; render(); window.scrollTo({top:0,behavior:"smooth"});
}
function flip(){flipped=!flipped; render();}
function go(d){const n=pos+d; if(n<0||n>=order.length) return; pos=n; resetCard(); render();}
function mark(s){
  const id=order[pos]; state.status[id]=s; save();
  if(state.onlyTodo&&s==="ok"){order.splice(pos,1); if(pos>=order.length) pos=Math.max(0,order.length-1); resetCard(); render(); return;}
  if(pos<order.length-1){pos++;} resetCard(); render();
}
document.getElementById("decks").addEventListener("click",e=>{const b=e.target.closest("button[data-deck]"); if(!b) return; state.deck=b.dataset.deck; save(); build();});
document.getElementById("t-todo").onclick=()=>{state.onlyTodo=!state.onlyTodo; save(); build();};
document.getElementById("t-shuffle").onclick=()=>{state.shuffle=!state.shuffle; save(); build();};
const reset=document.getElementById("t-reset"); let armed=false;
reset.onclick=()=>{ if(!armed){armed=true; reset.textContent="Confirmer la remise à zéro"; setTimeout(()=>{armed=false; reset.textContent="Remettre à zéro";},3000); return;}
  armed=false; reset.textContent="Remettre à zéro"; state.status={}; save(); build();};
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea")) return;
  if((e.key===" "||e.key==="Enter")&&e.target.closest&&e.target.closest("button")) return;
  if(e.key===" "||(e.key==="Enter"&&e.target.id==="card")){e.preventDefault(); flip();}
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="1"&&flipped) mark("todo");
  else if(e.key==="2"&&flipped) mark("ok");
});
build();

(function(){let x0=null,y0=null;const st=document.getElementById("stage");
st.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
st.addEventListener("touchend",e=>{if(x0===null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1);}},{passive:true});})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
